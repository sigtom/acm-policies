apiVersion: v1
kind: ConfigMap
metadata:
  name: managed-cluster-template-ad-ldaps
  namespace: open-cluster-management-policies
  labels:
    acm-config: ad-ldaps
    managed-cluster: managed-cluster-template
data:
  settings.yaml: |
    # Change only in the restricted client repository, never in a public sanitized repo.
    # Both IDs below refer to the actual ACM ManagedCluster name, not the API DNS name.
    configurationApproved: false

    # Choose once; later changes to identity IDs/usernames require a migration plan.
    idpName: ad-ldaps
    mappingMethod: claim
    ldapURL: "ldaps://REPLACE_WITH_LDAPS_FQDN:636"
    bindDN: "REPLACE_WITH_READ_ONLY_BIND_DN"
    usersBaseDN: "REPLACE_WITH_USERS_BASE_DN"

    # One shared username attribute for login and synced group members.
    # sAMAccountName assumes a unique domain namespace; review UPN for multiple domains.
    userNameAttribute: sAMAccountName
    # objectGUID is an OAuth identity ID, not the group-sync UID or username.
    # Group sync below uses string group DNs and the non-binary userNameAttribute.
    userIDAttribute: objectGUID
    displayNameAttribute: displayName
    emailAttribute: mail

    # AD must confirm the allowed-login filter, including account state and group scope.
    # Example form is documented in README; do not use an unrestricted directory filter blindly.
    oauthUserFilter: "REPLACE_WITH_APPROVED_LOGIN_FILTER"
    # Search enabled user objects for membership; avoid dropping valid users via a narrow OU/filter.
    syncUserFilter: "(&(objectCategory=person)(objectClass=user)(!(userAccountControl:1.2.840.113556.1.4.803:=2)))"

    # Set true only when AD confirms nested membership and the chosen search base covers its users.
    nestedGroups: false
    groups:
      - ldapDN: "REPLACE_WITH_PILOT_GROUP_DN"
        openshiftName: ad-ocp-pilot

    # PEM public CA chain only. Never place a private key here.
    caBundle: |
      REPLACE_WITH_PEM_CA_CHAIN

    # Obtain the CLI pullspec from the approved target OCP 4.21 payload or its mirror.
    syncImage: "REPLACE_WITH_APPROVED_CLI_IMAGE@sha256:REPLACE_WITH_64_HEX_DIGEST"
    syncSchedule: "*/30 * * * *"
    syncSuspend: true
    syncConfirm: false

    # Empty by default: authentication/group sync do not grant platform access by themselves.
    # Optional ad-ldaps-access policy consumes approved entries. See README.
    rbacBindings: []
