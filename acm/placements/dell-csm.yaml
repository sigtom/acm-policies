apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: dell-csm
  namespace: open-cluster-management-policies
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            capability.nmstate: "true"
            capability.powerflex: "true"
            capability.dell-csm: "true"
