apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: ad-ldaps-secrets
  namespace: open-cluster-management-policies
  annotations:
    policy.open-cluster-management.io/description: Check local bind-password Secrets and key presence without propagating
      their values.
spec:
  disabled: false
  remediationAction: inform
  dependencies:
  - apiVersion: policy.open-cluster-management.io/v1
    kind: Policy
    name: ad-ldaps-prereqs
    namespace: open-cluster-management-policies
    compliance: Compliant
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: ad-ldaps-secrets-config
      spec:
        remediationAction: inform
        severity: high
        pruneObjectBehavior: None
        object-templates-raw: |
          {{- range $ns := list "openshift-config" "ad-ldap-sync" }}
          {{- $secret := lookup "v1" "Secret" $ns "ad-ldap-bind" }}
          {{- $data := default (dict) $secret.data }}
          {{- if or (empty $secret) (ne $secret.type "Opaque") (empty (get $data "bindPassword")) }}
          {{- fail (printf "Provision Opaque Secret %s/ad-ldap-bind with a nonempty bindPassword key outside Git" $ns) }}
          {{- end }}
          - complianceType: musthave
            recordDiff: None
            objectDefinition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ad-ldap-bind
                namespace: {{ $ns | toJson }}
              type: Opaque
          {{ end }}
