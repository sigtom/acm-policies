apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: virt-vxflexos-ready
  namespace: open-cluster-management-policies
spec:
  disabled: false
  remediationAction: inform
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: virt-cdi-ready
      namespace: open-cluster-management-policies
      compliance: Compliant
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: dell-csm-powerflex-storage
      namespace: open-cluster-management-policies
      compliance: Compliant
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: virt-vxflexos-ready
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: storage.k8s.io/v1
                kind: StorageClass
                metadata:
                  name: vxflexos
                  annotations:
                    storageclass.kubernetes.io/is-default-class: "true"
            - complianceType: musthave
              objectDefinition:
                apiVersion: cdi.kubevirt.io/v1beta1
                kind: StorageProfile
                metadata:
                  name: vxflexos
