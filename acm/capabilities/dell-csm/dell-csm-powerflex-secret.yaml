apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: dell-csm-powerflex-secret
  namespace: open-cluster-management-policies
spec:
  disabled: false
  remediationAction: inform
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: dell-csm-pf-prereqs
      namespace: open-cluster-management-policies
      compliance: Compliant
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: dell-csm-powerflex-secret
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: vxflexos-config
                  namespace: vxflexos
                type: Opaque
