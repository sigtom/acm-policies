kind: ManagedClusterSetBinding
metadata:
  name: REPLACE_WITH_HUB_CLUSTERSET_NAME
  namespace: open-cluster-management-policies
spec:
  clusterSet: REPLACE_WITH_HUB_CLUSTERSET_NAME
